name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
#    environment: wp1-fall26-aws-env
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Publish
      run: dotnet publish src/Wp1Fall26Aws.Api -c Release -o publish

    - name: Add Procfile to publish output
      run: cp Procfile publish/Procfile
    
    - name: Zip deployment package
      run: |
        cd publish
        zip -r ../deploy.zip .
        
    - name: Debug OIDC token
      run: |
        echo "Fetching OIDC token..."
        TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
        "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
        echo "OIDC token:"
        echo "$TOKEN"
        
    - name: Debug OIDC Token Claims
      run: |
          # Request an OIDC token from GitHub's internal token service
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
 
          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
 
          # Extract and decode the middle part (the payload/claims)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64, then re-pad to a multiple of 4 so base64 -d won't truncate
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          DECODED=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)
 
          echo "=== OIDC CLAIMS FROM GITHUB ==="
          echo "$DECODED" | jq '{aud, iss, sub, repository, repository_owner, ref}'

    - name: Configure AWS credentials (OIDC, no long-lived keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
        aws-region: us-east-1

    - name: Confirm identity
      run: aws sts get-caller-identity

    - name: Upload deployment package to the EB storage bucket
      run: |
        BUCKET=$(aws elasticbeanstalk create-storage-location --query 'S3Bucket' --output text)
        echo "EB_BUCKET=$BUCKET" >> "$GITHUB_ENV"
        aws s3 cp deploy.zip "s3://$BUCKET/wp1-fall26-aws/deploy-${{ github.sha }}.zip"

    - name: Create application version
      run: |
        aws elasticbeanstalk create-application-version \
          --application-name wp1-fall26-aws \
          --version-label ${{ github.sha }} \
          --source-bundle S3Bucket="${{ env.EB_BUCKET }}",S3Key="wp1-fall26-aws/deploy-${{ github.sha }}.zip"

    - name: Deploy to the environment
      run: |
        aws elasticbeanstalk update-environment \
          --environment-name wp1-fall26-aws-env \
          --version-label ${{ github.sha }}
