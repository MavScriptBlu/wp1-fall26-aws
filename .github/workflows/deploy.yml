name: Build, test, and deploy

# PRs into main: build + test only (deploy is skipped by the if: below).
# Pushes to main: build, test, then deploy. The manual button works too.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# Default for every job: read the repo, nothing else.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Restore
      run: dotnet restore Wp1Fall26Aws.slnx

    - name: Build
      run: dotnet build Wp1Fall26Aws.slnx --configuration Release --no-restore

    # THE GATE: a failing test fails this job, which skips deploy.
    - name: Test
      run: dotnet test Wp1Fall26Aws.slnx --configuration Release --no-build

    - name: Publish the API
      run: dotnet publish src/Wp1Fall26Aws.Api/Wp1Fall26Aws.Api.csproj --configuration Release --no-build --output ./publish

    - name: Add Procfile to publish output
      run: cp Procfile publish/Procfile

    # Hand the exact tested build to the deploy job (it runs on a different machine).
    - name: Upload the tested build as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-publish
        path: ./publish

  deploy:
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # only this job may request an OIDC token for AWS
    steps:
    - name: Download the tested build
      uses: actions/download-artifact@v5
      with:
        name: api-publish
        path: ./publish

    - name: Zip deployment package
      run: |
        cd publish
        zip -r ../deploy.zip .

    - name: Configure AWS credentials (OIDC, no long-lived keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
        aws-region: us-east-1

    - name: Confirm identity
      run: aws sts get-caller-identity

    - name: Upload deployment package to the EB storage bucket
      run: |
        EB_BUCKET="elasticbeanstalk-us-east-1-407525819435"
        echo "EB_BUCKET=$EB_BUCKET" >> "$GITHUB_ENV"
        aws s3 cp deploy.zip "s3://$EB_BUCKET/wp1-fall26-aws/deploy-${{ github.sha }}.zip"

    - name: Create application version
      run: |
        aws elasticbeanstalk create-application-version \
          --application-name wp1-fall26-aws \
          --version-label ${{ github.sha }} \
          --source-bundle S3Bucket="${{ env.EB_BUCKET }}",S3Key="wp1-fall26-aws/deploy-${{ github.sha }}.zip"

    - name: Deploy to the environment
      run: |
        aws elasticbeanstalk update-environment \
          --environment-name wp1-fall26-aws-env \
          --version-label ${{ github.sha }}
